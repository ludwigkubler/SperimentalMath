[[open_subquestions]]
id                = "sub1"
text              = "For n ∈ {20, 50, 100, 150, 200}, use kissat to empirically determine the 50%-satisfiability point alpha_3(n). Fit the finite-n threshold to a model alpha_3(n) = alpha_3^* + c · n^(-gamma) and extrapolate to n → ∞. How close does the extrapolation come to the predicted 4.267?"
suggested_attack  = "Generate ~1000 random 3-SAT instances per (n, alpha) at 20 alpha values bracketing the threshold; measure satisfiable-fraction; bisect to find 50% point; fit power-law in n."
estimated_compute = "Hours on RTX 3070 Ti + multi-core CPU; kissat is fast on n <= 200."
status            = "open"

[[open_subquestions]]
id                = "sub2"
text              = "At the empirical threshold for each n, is there a *measurable* clustering transition? I.e. does the *number of clusters of solutions* (computed via belief propagation or sampled by Walksat with many restarts) jump at the predicted alpha_d ≈ 3.86 for k=3?"
suggested_attack  = "Run belief-propagation algorithm at finite n; count fixed points; compare to predicted clustering threshold. Validate the 1-RSB physics."
estimated_compute = "Days; BP is more compute-intensive than kissat."
status            = "open"

[[open_subquestions]]
id                = "sub3"
text              = "Random 3-SAT vs *planted* 3-SAT: at and above the threshold, planted-3-SAT (where a satisfying assignment exists by construction) is structurally distinguishable from random uniform 3-SAT. What's the smallest n at which this distinguishability becomes empirically measurable?"
suggested_attack  = "Generate paired instances at alpha near the threshold: one uniform, one planted with the same alpha. Measure detectability via spectral analysis of the factor graph."
estimated_compute = "Days; sampling + spectral analysis."
status            = "open"
