problem_id    = "PERMANENT_DETERMINANT_VALIANT_79"
title         = "Permanent vs Determinant — minimum determinantal complexity"
field         = "algebraic_complexity"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
The *permanent* of an \\(n \\times n\\) matrix \\(A = (a_{ij})\\) is
\\(\\mathrm{perm}(A) = \\sum_{\\sigma \\in S_n} \\prod_{i=1}^n a_{i, \\sigma(i)}\\).
The *determinant* differs only by the sign of each permutation.

Valiant (1979) asked: for what \\(m = m(n)\\) is there an \\(m \\times m\\)
matrix \\(B\\) whose entries are affine functions of the \\(n^2\\) entries
of \\(A\\), such that \\(\\det(B) = \\mathrm{perm}(A)\\)?

\\(m(n)\\) is called the *determinantal complexity* of the permanent.

Known bounds (status 2024):
- Upper: \\(m(n) \\leq 2^n - 1\\) (Grenet 2014, improving Valiant's
  original \\(O(2^n)\\)). Combinatorial construction.
- Lower: \\(m(n) \\geq n^2 / 2\\) (Mignon–Ressayre 2004), using
  Hessian-rank-based analysis.
- Lower (small-n, exact): \\(m(2) = 2\\), \\(m(3) = 7\\) (Jansen 2011),
  \\(m(4) = 13\\) (Brualdi–Cao 2024 [VERIFY], slight uncertainty on
  attribution and year).

The central conjecture (Valiant): \\(m(n) = 2^{\\Omega(n)}\\).
Equivalently: VP ≠ VNP (the algebraic analogue of P ≠ NP).

Specific empirical-math question: for \\(n \\in \\{4, 5, 6, 7, 8\\}\\),
compute the *exact* minimum \\(m(n)\\) (or improved lower bounds) by
solving a constraint-satisfaction problem over the entries of a candidate
\\(B\\). Does the value of \\(m(n)\\) for small \\(n\\) hint at a
super-polynomial or polynomial scaling?
"""
lean_file = "PERMANENT_DETERMINANT_VALIANT_79.lean"

[significance_to_pvsnp]
text = """
The Valiant 1979 conjecture (VP ≠ VNP) is the algebraic analogue of
P ≠ NP. In Mulmuley–Sohoni's Geometric Complexity Theory (GCT)
programme, *separating VP from VNP via geometric obstructions* is
proposed as the most concrete attack on P vs NP.

A super-polynomial *unconditional* lower bound on \\(m(n)\\) would:
1. Resolve VP vs VNP — the central open problem of algebraic complexity.
2. Provide the first super-polynomial lower bound on a P-vs-NP-analogous
   model not subject to the natural-proofs barrier (the algebraic
   setting is barrier-free in the Razborov-Rudich sense).
3. Inform the GCT programme — though GCT envisions a proof via
   representation-theoretic obstructions, not via determinantal
   complexity directly.

Empirical improvements for small \\(n\\) are publishable in *J. Algebra*
or *Linear Algebra and Its Applications*. They do NOT resolve VP vs VNP
but they tighten the constants in the Mignon–Ressayre lower bound and
provide concrete benchmarks for theoretical proposals.
"""

[[known_bounds]]
type            = "upper"
parameter       = "m(n) — determinantal complexity of perm_n"
value_expr      = "2^n - 1"
range_valid     = "all n >= 2"
reference_key   = "grenet_2014"
notes           = "Combinatorial construction using path-matrix duality."

[[known_bounds]]
type            = "lower"
parameter       = "m(n)"
value_expr      = "n^2 / 2"
range_valid     = "all n >= 3"
reference_key   = "mignon_ressayre_2004"
notes           = "Hessian-rank argument: the Hessian of the determinant at the singular point has a specific rank pattern."

[[known_bounds]]
type            = "equality"
parameter       = "m(3)"
value_expr      = "7"
range_valid     = "exact"
reference_key   = "jansen_2011"
notes           = "Established m(3) = 7. Smallest non-trivial exact value."

[[known_bounds]]
type            = "lower"
parameter       = "m(n)"
value_expr      = "(1/2) n^2"
range_valid     = "all n >= 3"
reference_key   = "landsberg_2014"
notes           = "Landsberg-Manivel-Ressayre improved analysis; same asymptotic but refined constants."

[[known_barriers]]
name          = "natural_proofs"
caveat        = "Algebraic complexity (VP vs VNP) is FREE of the natural-proofs barrier. Razborov-Rudich pseudorandom functions do not exist in the algebraic-circuit model."
reference_key = "razborov_rudich_1997"

[[known_barriers]]
name          = "algebrization"
caveat        = "Algebrization (Aaronson-Wigderson 2008) targets Boolean complexity classes; not directly applicable to VP vs VNP."

