problem_id    = "RANDOM_KSAT_FRIEDGUT_99"
title         = "Sharp satisfiability threshold for random 3-SAT (Friedgut's conjecture)"
field         = "sat_hardness"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
In *random k-SAT* with \\(n\\) variables and \\(m = \\alpha n\\) clauses (each
clause is a uniformly-random k-tuple of distinct variables with each literal
negated independently with probability 1/2), let \\(p_{k,n}(\\alpha)\\) be
the probability that the resulting formula is satisfiable.

Friedgut (1999) proved: for every k ≥ 2, there is a *sharp threshold*
function \\(\\alpha_k(n)\\) such that for every \\(\\epsilon > 0\\),

\\[
\\lim_{n \\to \\infty} p_{k,n}(\\alpha_k(n) - \\epsilon) = 1, \\qquad
\\lim_{n \\to \\infty} p_{k,n}(\\alpha_k(n) + \\epsilon) = 0.
\\]

For k = 2, \\(\\alpha_2 = 1\\) (Goerdt 1992, Chvátal–Reed 1992).

For k = 3, the threshold is known to *exist* (Friedgut 1999) and to satisfy
\\(\\alpha_3(n) \\to \\alpha_3^*\\) for some absolute constant \\(\\alpha_3^* \\approx
4.267\\) (Mertens, Mézard, Zecchina 2006 from physics; Ding–Sly–Sun 2014–2022
rigorous upper and lower bounds converging on \\(\\alpha_3^* = 4.267...\\) but
not exactly identifying it).

Open: does \\(\\alpha_3(n)\\) converge to an absolute constant \\(\\alpha_3^*\\)
rigorously, with the predicted value? The rigorous bounds are
\\(\\alpha_3^{\\text{lower}} \\geq 4.0 - \\epsilon\\) (Coja-Oghlan 2014) and
\\(\\alpha_3^{\\text{upper}} \\leq 4.4943\\) (Kirousis et al. 1998 + refinements).
The conjecture is that the threshold converges to a specific value (likely
4.267) predicted by replica-symmetry-breaking analysis.

Specific empirical-math question: can we *empirically* identify the
threshold to within ±0.01 for n ≤ 200 using kissat as oracle, and fit a
finite-size scaling law that extrapolates to the asymptote?
"""
lean_file = "RANDOM_KSAT_FRIEDGUT_99.lean"

[significance_to_pvsnp]
text = """
Random 3-SAT is the canonical *hardness benchmark* for NP problems:
- The threshold \\(\\alpha_3^*\\) is where 3-SAT becomes "hard on average":
  near the threshold, the best algorithms scale exponentially.
- Identifying the threshold to high precision is required for designing
  hardness reductions that preserve average-case difficulty.
- The k=3 case is the smallest where the replica-symmetry-breaking
  phenomenon (1-RSB) occurs, providing a window onto the *geometry* of
  the solution space — relevant for understanding why local-search
  algorithms fail above the *clustering threshold* (\\(\\alpha_d^* \\approx
  3.86\\) for k=3).

Tightening the threshold is NOT a direct attack on P vs NP, but it sharpens
the tools used in:
1. Reductions between NP problems preserving average-case complexity.
2. Cryptographic hardness assumptions based on planted-3-SAT.
3. Distinguishing structural from computational hardness.
"""

[[known_bounds]]
type            = "lower"
parameter       = "alpha_3 (satisfiability threshold for random 3-SAT)"
value_expr      = "alpha_3 >= 3.52"
range_valid     = "n -> infinity"
reference_key   = "kaporis_kirousis_lalas_2006"
notes           = "Lower bound via second-moment method on a refined random structure."

[[known_bounds]]
type            = "lower"
parameter       = "alpha_3"
value_expr      = "alpha_3 >= 3.86"
range_valid     = "n -> infinity"
reference_key   = "coja_oghlan_2014"
notes           = "Best rigorous lower bound, via planted-3-SAT analysis. Threshold is at least 3.86."

[[known_bounds]]
type            = "upper"
parameter       = "alpha_3"
value_expr      = "alpha_3 <= 4.4943"
range_valid     = "n -> infinity"
reference_key   = "kirousis_kranakis_krizanc_stamatiou_1998"
notes           = "Upper bound via first-moment method with refined statistic."

[[known_bounds]]
type            = "equality"
parameter       = "alpha_3 (conjectured)"
value_expr      = "alpha_3* approx 4.267"
range_valid     = "n -> infinity"
reference_key   = "mertens_mezard_zecchina_2006"
notes           = "Non-rigorous physics prediction via 1-RSB cavity method. Strong consensus but not a theorem."

[[known_bounds]]
type            = "equality"
parameter       = "alpha_k (k -> infinity)"
value_expr      = "alpha_k = 2^k ln 2 - (1+ln 2)/2 + o(1)"
range_valid     = "k large, n -> infinity"
reference_key   = "ding_sly_sun_2022"
notes           = "Resolves the threshold rigorously for k >= k_0 (some large constant). Does NOT cover k = 3."

[[known_barriers]]
name          = "natural_proofs"
caveat        = "Not applicable — this is an average-case complexity question, not a circuit lower bound."

