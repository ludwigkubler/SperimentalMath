id                = "sub1"
text              = "For Ramanujan graphs at n ∈ {20, 40, 60, 80, 100} (LPS construction), compute the resolution width of Tseitin via kissat-with-resolution-proof-extraction. How does the empirical width vs n compare to the BSW prediction lambda * n / k?"
suggested_attack  = "Generate LPS graphs; encode Tseitin formula; run kissat with DRAT proof; extract resolution refutation; measure max clause width. Plot width vs n."
estimated_compute = "Days; small (n < 100) Tseitin instances are within kissat range, but DRAT post-processing is the bottleneck."
status            = "open"

