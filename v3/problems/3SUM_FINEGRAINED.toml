problem_id    = "3SUM_FINEGRAINED"
title         = "Tightness of the 3SUM lower bound and average-case hardness"
field         = "fine_grained"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
3SUM is the canonical problem of fine-grained complexity: given a list of
\\(n\\) integers, determine whether some three sum to zero.

The naive algorithm runs in \\(O(n^2)\\) time after sorting. The
*3SUM conjecture* posits that no algorithm runs in \\(O(n^{2-\\epsilon})\\)
time on the *word RAM* with logarithmic word size, for any fixed
\\(\\epsilon > 0\\).

Status:
- The conjecture is widely believed; many subsequent fine-grained
  lower bounds *assume* it.
- Baran–Demaine–Pătraşcu (2008) showed \\(O(n^2 / \\log^2 n)\\) on the
  word RAM (asymptotically beating \\(n^2\\), but still consistent with
  the conjecture).
- Grønlund–Pettie (2014) showed \\(O(n^2 (\\log\\log n / \\log n)^{2/3})\\)
  for *real-input* 3SUM in the decision-tree model.
- Kane–Lovett–Moran (2017) gave a near-quadratic decision-tree lower
  bound (matching the upper bound asymptotically).
- Pătraşcu–Williams (2010): if 3SUM admits \\(O(n^{2-\\epsilon})\\) on
  word RAM, several other problems also admit improved bounds. The
  converse direction is open.

Specific empirical-math question: on adversarially-constructed inputs,
how does the *time-versus-input-distribution* curve behave for the best
known 3SUM algorithms? Is there an empirical "hardness witness" — a
specific input distribution — on which all known algorithms exhibit
quadratic scaling, ruling out adversary-oblivious sub-quadratic
algorithms in practice?
"""
lean_file = "3SUM_FINEGRAINED.lean"

[significance_to_pvsnp]
text = """
Fine-grained complexity is the modern framework for distinguishing
*polynomial-time* complexity classes — exactly the regime that P vs NP
sits in. The 3SUM conjecture is the central hub from which many
fine-grained reductions emanate:

- OV (Orthogonal Vectors) conjecture — used to prove no
  \\(O(n^{2-\\epsilon})\\) edit distance algorithm.
- APSP (All-Pairs Shortest Paths) conjecture — connects to dynamic data
  structures.
- Many string algorithms (suffix array, etc.) have 3SUM-hard variants.

The 3SUM conjecture does NOT imply P ≠ NP (3SUM is in P), but:
1. A *proof* of the 3SUM conjecture in a restricted model (e.g. linear
   decision trees) is plausibly within reach and would be a major
   result.
2. Empirical hardness evidence informs whether ongoing algorithmic
   improvements (\\(\\log\\log n\\) factors) eventually reach a wall.

This is the most-cited fine-grained question. Tightening its empirical
profile is publishable at *ACM TOCT* / *J. ACM*.
"""

[[known_bounds]]
type            = "upper"
parameter       = "time_3SUM(n) on word RAM"
value_expr      = "O(n^2)"
range_valid     = "all n"
reference_key   = "folklore_3sum"
notes           = "Standard textbook algorithm: sort then two-pointer scan."

[[known_bounds]]
type            = "upper"
parameter       = "time_3SUM(n) on word RAM"
value_expr      = "O(n^2 / log^2 n)"
range_valid     = "all n"
reference_key   = "baran_demaine_patrascu_2008"
notes           = "Tabulation-based; uses word-level parallelism."

[[known_bounds]]
type            = "upper"
parameter       = "time_3SUM(n) on real RAM (decision tree)"
value_expr      = "O(n^2 (log log n / log n)^(2/3))"
range_valid     = "all n"
reference_key   = "gronlund_pettie_2014"
notes           = "Sub-quadratic ALGEBRAIC decision tree on real inputs. Does not contradict 3SUM conjecture on word RAM with integer inputs."

[[known_bounds]]
type            = "lower"
parameter       = "time_3SUM(n) in LINEAR decision tree model"
value_expr      = "Omega(n^2)"
range_valid     = "all n"
reference_key   = "erickson_1999"
notes           = "Linear decision tree lower bound: any LDT algorithm requires Omega(n^2) comparisons."

[[known_bounds]]
type            = "lower"
parameter       = "time_3SUM(n) word RAM"
value_expr      = "(conjectured) Omega(n^(2-o(1)))"
range_valid     = "all n"
reference_key   = "patrascu_williams_2010"
notes           = "The 3SUM conjecture. No unconditional lower bound on word RAM is known."

[[known_barriers]]
name          = "algebrization"
caveat        = "Standard barriers (relativization, naturalization, algebrization) target separation of complexity *classes*, not lower bounds for specific problems. Not directly applicable."

