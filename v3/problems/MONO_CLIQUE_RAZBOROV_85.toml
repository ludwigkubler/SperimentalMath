problem_id    = "MONO_CLIQUE_RAZBOROV_85"
title         = "Closing the gap in Razborov's monotone CLIQUE lower bound"
field         = "circuit_lb"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
A monotone Boolean circuit uses only AND and OR gates (no NOT). The k-CLIQUE
function, on an input graph encoded as \\(\\binom{n}{2}\\) edge variables,
outputs 1 iff the input graph contains a clique of size \\(k\\).

Razborov (1985) proved the first super-polynomial monotone lower bound:
the size of any monotone circuit computing k-CLIQUE on n-vertex inputs is at
least \\(n^{\\Omega(k)}\\), for \\(k \\leq (\\log n)^{1/4}\\).
Alon and Boppana (1987) refined the analysis to extend the range to
\\(k \\leq c \\cdot (\\log n)^{1/2}\\) and improved the constant.

The natural conjecture is that a much stronger bound holds: for some
\\(\\delta > 0\\), the lower bound \\(n^{\\Omega(k)}\\) extends to \\(k = n^{\\delta}\\)
(or even to all \\(k \\leq n/2\\)). Forty years later, no proof closing
this gap is known. The bottleneck is the *approximation method* — the
polynomial-degree-based argument used in Razborov 1985 breaks down outside
the polylog regime.

Specific empirical-math question: how does the relevant polynomial degree
(the minimum degree of an approximator agreeing with k-CLIQUE on \\(\\binom{[n]}{k}\\))
scale with \\(k\\) for fixed small \\(n\\)? Does the scaling hint at a
combinatorial obstruction that prevents extending Razborov's argument to
\\(k = n^\\delta\\)?
"""
lean_file = "MONO_CLIQUE_RAZBOROV_85.lean"

[significance_to_pvsnp]
text = """
CLIQUE is NP-complete. A super-polynomial *monotone* lower bound for any
NP-complete function does NOT directly imply P ≠ NP, because monotone
classes are strictly weaker than P/poly (an NP function may admit a
small non-monotone circuit). However, the monotone class is the *only*
non-trivial class in which we have super-polynomial lower bounds for
explicit functions. Closing the k-CLIQUE gap to k = n^δ would:

1. Be the first such bound in the regime k = polynomial-in-n, after 40 years
   of plateau, and would represent the highest-confidence lower bound in
   circuit complexity.
2. Resolve the open question of whether the approximation method itself
   can yield bounds in this regime, or whether a categorically new technique
   is needed.
3. Inform the design of bounded-error randomized lower bounds for
   k-CLIQUE in the monotone model, with downstream consequences for
   communication complexity (via Karchmer-Wigderson).

It would NOT, by itself, resolve P vs NP. But it is universally regarded
as a non-trivial step on the path.
"""

[[known_bounds]]
type            = "lower"
parameter       = "monotone_size(k-CLIQUE, n)"
value_expr      = "n^Omega(k)"
range_valid     = "k <= (log n)^(1/4)"
reference_key   = "razborov_1985"
notes           = "Original approximation method; constants explicit but small."

[[known_bounds]]
type            = "lower"
parameter       = "monotone_size(k-CLIQUE, n)"
value_expr      = "n^Omega(k)"
range_valid     = "k <= c * (log n)^(1/2)"
reference_key   = "alon_boppana_1987"
notes           = "Refined approximation method; better range and constants."

[[known_bounds]]
type            = "upper"
parameter       = "monotone_size(k-CLIQUE, n)"
value_expr      = "O(n^k * k)"
range_valid     = "all k"
reference_key   = "trivial_upper"
notes           = "Trivial: enumerate all k-subsets, AND each one."

[[known_barriers]]
name          = "natural_proofs"
caveat        = """
The natural-proofs barrier (Razborov-Rudich 1997) explicitly does NOT
apply to monotone circuits. The Razborov 1985 argument is non-natural
because the lower-bound predicate (`approximator polynomial does NOT
agree with f on Y_k`) is not constructive in the Razborov-Rudich sense.
So this problem lives BELOW the natural-proofs barrier: a proof here
gives no information about P vs NP barriers.
"""
reference_key = "razborov_rudich_1997"

