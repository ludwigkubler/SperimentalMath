[[open_subquestions]]
id                = "sub1"
text              = "Compute, for fixed small n (say n <= 12), the minimum-degree polynomial that 0/1-agrees with k-CLIQUE on all k-subsets, as a function of k. Does the degree behave qualitatively differently for k <= (log n)^(1/2) vs k > (log n)^(1/2)?"
suggested_attack  = "Explicit linear-programming computation of the agreement polynomial. Feasible on RTX 3070 Ti for n <= 10, possibly n <= 12 with sparse-matrix tricks. Cite Sherali-Adams or sum-of-squares hierarchies if applicable."
estimated_compute = "Hours on a single GPU/CPU; well below 24h."
status            = "open"

[[open_subquestions]]
id                = "sub2"
text              = "For k just above the (log n)^(1/2) threshold, can the approximation-method polynomial be replaced by a non-polynomial structural witness (e.g. a sunflower lemma generalization) that still admits a Razborov-style argument?"
suggested_attack  = "Experimental: generate random monotone circuits at the threshold, fit them with both the Razborov approximator and candidate alternatives (sunflower-free families, Razborov-Smolensky polynomials over different rings). Measure approximation error."
estimated_compute = "Days on RTX 3070 Ti; bounded by circuit-enumeration cost."
status            = "open"

[[open_subquestions]]
id                = "sub3"
text              = "Is there an empirical correlation between the monotone-circuit size of k-CLIQUE (as measured via SAT-encoded enumeration of small circuits) and the polynomial degree of the agreement set, for n where exact computation is feasible (n <= 8)?"
suggested_attack  = "Encode monotone-circuit existence at given size as a SAT instance; run kissat. Compare measured minimum size to predicted size from Alon-Boppana applied to that small n."
estimated_compute = "Hours per (n, k, size) triple; full sweep for n <= 8 in a few days."
status            = "open"
