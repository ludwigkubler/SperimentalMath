problem_id    = "AC0_PARITY_HASTAD_86"
title         = "Tightness of Håstad's switching lemma for depth-d AC^0 lower bound on PARITY"
field         = "circuit_lb"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
The class \\(\\mathsf{AC}^0\\) consists of Boolean circuits of unbounded
fan-in over the basis \\(\\{\\mathrm{AND}, \\mathrm{OR}, \\mathrm{NOT}\\}\\),
of polynomial size and constant depth.

Furst-Saxe-Sipser (1984) showed PARITY \\(\\notin \\mathsf{AC}^0\\).
Yao (1985) gave a stronger bound. Håstad (1986) gave the now-standard
proof via the *switching lemma*, yielding the bound:

\\[
\\mathrm{size}_d(\\mathrm{PARITY}) \\geq 2^{c \\cdot n^{1/(d-1)}}
\\]

for any \\(\\mathsf{AC}^0\\) circuit of depth \\(d\\) computing PARITY on
\\(n\\) inputs, for some absolute constant \\(c > 0\\).

The bound is *qualitatively* tight: PARITY admits a depth-d circuit of
size \\(2^{O(n^{1/(d-1)})}\\) for every constant \\(d\\). However the
*constant* in the exponent has gone through multiple refinements
(Håstad 1986 → Håstad–Wegener 1987 → Impagliazzo–Matthews–Paturi 2012 →
Håstad 2014 → others), and the optimal constant remains open even for
\\(d = 3\\).

Specific empirical-math question: how does the random-restriction
shrinkage rate (the central parameter \\(p\\) in the switching lemma)
behave on PARITY-computing circuits at the threshold size? Does the
shrinkage rate exhibit the discontinuous behaviour predicted by the
optimal-constant conjecture?
"""
lean_file = "AC0_PARITY_HASTAD_86.lean"

[significance_to_pvsnp]
text = """
\\(\\mathsf{AC}^0\\) is the most-studied non-trivial bounded-depth circuit
class with super-polynomial lower bounds for explicit functions. Tightness
of the Håstad bound is the *only* place in complexity theory where we know
both an upper and a lower bound matching in qualitative form for an
explicit function in P. Improving constants here has direct downstream
applications:

1. *Pseudorandom generators* against \\(\\mathsf{AC}^0\\) (Braverman 2010,
   Nisan 1991): their seed length depends on the switching-lemma constant.
2. *Derandomization* of \\(\\mathsf{AC}^0\\): if the constant can be improved
   to optimal, polynomial-stretch PRGs become explicit.
3. *Beyond \\(\\mathsf{AC}^0\\)*: techniques refined here generalize to
   \\(\\mathsf{AC}^0[\\oplus]\\) (Razborov-Smolensky), \\(\\mathsf{AC}^0[m]\\)
   for prime m (Williams 2014).

Improving the Håstad constant does NOT resolve P vs NP — \\(\\mathsf{AC}^0\\)
is far below P/poly — but it tightens the most-cited bound in circuit
complexity and would inform downstream PRG constructions that may
eventually attack barriers.
"""

[[known_bounds]]
type            = "lower"
parameter       = "size_{depth=d}(PARITY, n)"
value_expr      = "2^{Omega(n^(1/(d-1)))}"
range_valid     = "all d >= 2, all n >= 1"
reference_key   = "hastad_1986"
notes           = "Switching-lemma proof. Implicit constant ≈ 1/10 (Håstad's original)."

[[known_bounds]]
type            = "lower"
parameter       = "size_{depth=d}(PARITY, n)"
value_expr      = "2^{(c_d) * n^(1/(d-1))}"
range_valid     = "d = 3, all n >= 1"
reference_key   = "impagliazzo_matthews_paturi_2012"
notes           = "c_3 ≈ 1/30 explicit; matches the random-restriction analysis with sharp parameters."

[[known_bounds]]
type            = "upper"
parameter       = "size_{depth=d}(PARITY, n)"
value_expr      = "2^{O(n^(1/(d-1)))}"
range_valid     = "all d >= 2, all n >= 1"
reference_key   = "hastad_1986"
notes           = "Standard tree-of-tree construction; constant in the exponent matches the lower bound up to a factor."

[[known_barriers]]
name          = "natural_proofs"
caveat        = "The Håstad bound is NOT subject to the natural-proofs barrier: AC^0 admits no pseudorandom function, so all proofs of AC^0 lower bounds are trivially non-natural in the Razborov-Rudich sense."
reference_key = "razborov_rudich_1997"

[[known_barriers]]
name          = "algebrization"
caveat        = "Algebrization (Aaronson-Wigderson 2008) does not apply to AC^0 lower bounds — the model is too weak."
reference_key = "aaronson_wigderson_2008"

