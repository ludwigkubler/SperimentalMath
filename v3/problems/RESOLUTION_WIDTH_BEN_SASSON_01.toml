suggested_attack  = "Generate random k-regular graphs; verify their (approximate) expansion via second-eigenvalue computation; encode Tseitin; measure width via DRAT. Plot empirical width / (predicted BSW width) ratio."
estimated_compute = "Days; spectral computation + DRAT analysis."
status            = "open"

