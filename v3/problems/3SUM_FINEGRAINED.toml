[[open_subquestions]]
id                = "sub1"
text              = "Implement Baran-Demaine-Pătraşcu (O(n^2/log^2 n)) and the textbook O(n^2) algorithms in Rust/C, and measure their actual scaling on adversarial inputs (worst-case for each algorithm). At which n do the constants in BDP catch up to the n^2 baseline, and does the asymptotic improvement materialize for n in [10^4, 10^6]?"
suggested_attack  = "Construct three classes of adversarial inputs: (a) uniformly random, (b) arithmetic-progression-rich (worst-case for textbook), (c) BDP-hostile (constructed to defeat the tabulation). Time each algorithm on each input class for n = 10^3, 10^4, 10^5, 10^6. Plot wall-clock vs n."
estimated_compute = "Days (multi-core CPU); 3SUM is CPU-bound, not GPU-bound."
status            = "open"

[[open_subquestions]]
id                = "sub2"
text              = "Construct an explicit input distribution on which Grønlund-Pettie's decision-tree algorithm achieves its claimed (log log n / log n)^(2/3) speedup — is this regime accessible at any feasible n, or is it asymptotic-only?"
suggested_attack  = "Implement the Grønlund-Pettie algorithm; for large n (10^5+), count actual comparisons; compare to the textbook count of (n choose 3). Empirically determine the crossover n."
estimated_compute = "Days; implementation is non-trivial."
status            = "open"

[[open_subquestions]]
id                = "sub3"
text              = "Average-case hardness: define a parameterized family of input distributions (varying entropy / structure). For each distribution, measure the time of the best-known 3SUM algorithm. Is there a *natural* distribution on which 3SUM remains hard, or do all natural distributions admit a sub-quadratic average-case algorithm?"
suggested_attack  = "Sample inputs from k different distributions; run the algorithm; build a histogram. Apply statistical tests to detect distribution-specific speedups."
estimated_compute = "Days; large-scale statistical sampling."
status            = "open"
