problem_id    = "RESOLUTION_WIDTH_BEN_SASSON_01"
title         = "Tight Width-Size relationship for Tseitin formulas on expander graphs"
field         = "proof_complexity"
status        = "active"
curated_by    = "Ludovico Kubler"
last_reviewed = 2026-05-19

[statement]
markdown = """
*Resolution* is the proof system that derives unsatisfiability of a CNF
formula by repeatedly applying the resolution rule:
\\((C \\vee x), (D \\vee \\neg x) \\;\\vdash\\; (C \\vee D)\\).

The *width* of a resolution refutation is the maximum clause length appearing
in the proof. The *size* is the total number of distinct clauses.

Ben-Sasson and Wigderson (2001) proved the foundational *Width-Size
theorem*: for any unsatisfiable CNF F over n variables,
\\[
S(F) \\geq \\exp\\!\\left( \\Omega\\!\\left( \\frac{(W(F) - W_0(F))^2}{n} \\right) \\right)
\\]
where \\(S(F)\\) is the minimum resolution refutation size and
\\(W(F)\\), \\(W_0(F)\\) are the minimum width of any refutation and the
initial width of the formula respectively.

Application to *Tseitin formulas* over expander graphs: \\(W(F) = \\Theta(n)\\)
yields \\(S(F) = 2^{\\Omega(n)}\\) — exponential lower bound on resolution
size.

The width-size relation is *qualitatively tight* but the *constants* matter:
- The original BSW analysis is tight up to constants for random k-CNF.
- For Tseitin on *Ramanujan graphs* (girth ≈ \\(\\log n\\), expander
  constant near optimal), the predicted resolution width is
  \\(\\geq c \\cdot n\\) for a specific constant c depending on the
  expansion parameter.

Specific empirical-math question: for explicit Ramanujan graphs (LPS,
Margulis-Gabber-Galil), what is the exact resolution width of the
corresponding Tseitin formula? Does the constant c match the BSW
prediction, or is there structural improvement on Ramanujan graphs?
"""
lean_file = "RESOLUTION_WIDTH_BEN_SASSON_01.lean"

[significance_to_pvsnp]
text = """
Resolution is the most-studied proof system; modern SAT solvers (DPLL,
CDCL) operate within resolution. Resolution lower bounds:
1. Directly imply lower bounds on running time of DPLL-style algorithms.
2. Feed into proof-complexity lower bounds for stronger systems (cutting
   planes, Frege).
3. Provide the only known unconditional super-polynomial lower bounds
   for any natural NP-complete problem solvable by a deterministic
   algorithm with proof.

For P vs NP:
- A super-polynomial lower bound on resolution for a *natural* family
  (Tseitin on expanders) gives unconditional exponential lower bounds
  on DPLL — concrete evidence that 3SAT is hard on average.
- Tightening the constant for Tseitin on Ramanujan graphs identifies
  the *optimal* hard instances for SAT solvers.
- The width-size relationship is the *paradigm* for proof-complexity
  lower bounds; sharpening it directly informs cutting-planes (Krajíček
  1998) and Frege (Pudlák, Buss).

Empirical improvements on the constants ARE publishable. *Logical
Methods in Computer Science* and *J. Symbolic Logic* welcome empirical
proof-complexity work.
"""

[[known_bounds]]
type            = "lower"
parameter       = "resolution_size(Tseitin on G, n)"
value_expr      = "2^Omega(n)"
range_valid     = "G is expander; n = |V(G)|"
reference_key   = "ben_sasson_wigderson_2001"
notes           = "From the width-size theorem: width(Tseitin) = Theta(n) gives size 2^Omega(n)."

[[known_bounds]]
type            = "lower"
parameter       = "resolution_width(Tseitin on G, n)"
value_expr      = "lambda(G) * n / k"
range_valid     = "G is a k-regular expander with expansion lambda"
reference_key   = "ben_sasson_wigderson_2001"
notes           = "Width is proportional to the expansion factor. Specific constants depend on expansion definition."

[[known_bounds]]
type            = "upper"
parameter       = "resolution_size(Tseitin on G, n)"
value_expr      = "2^O(n) * poly(n)"
range_valid     = "all graphs G"
reference_key   = "urquhart_1987"
notes           = "Trivial: enumerate truth assignments. Used as upper-bound baseline."

[[known_barriers]]
name          = "natural_proofs"
caveat        = "Resolution lower bounds are unconditional and NOT subject to the naturalization barrier (resolution does not capture any pseudorandom function class)."
reference_key = "razborov_rudich_1997"

