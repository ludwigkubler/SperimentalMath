[[open_subquestions]]
id                = "sub1"
text              = "For n = 4, what is the exact value of m(4)? Mignon-Ressayre gives m(4) >= 8; literature has m(4) <= 14 (a generic construction). Improve either bound by explicit search."
suggested_attack  = "Encode 'does there exist an m x m matrix B with affine entries such that det(B) = perm_4'? as a polynomial system or SAT instance. Use kissat / z3 / sage on the polynomial-system form, with bisection on m."
estimated_compute = "Days; n=4 is at the edge of feasibility with current solvers."
status            = "open"

[[open_subquestions]]
id                = "sub2"
text              = "Compute the Hessian-rank profile (Mignon-Ressayre statistic) for explicit small-m candidate matrices for perm_n at n = 4, 5, 6. Does the rank pattern reveal additional constraints beyond the n²/2 lower bound?"
suggested_attack  = "Symbolic computation: for each candidate (m, n), generate the symbolic Hessian and compute its rank symbolically. Look for systematic rank deficiency exposing further lower bounds."
estimated_compute = "Hours on CPU using sage/sympy."
status            = "open"

[[open_subquestions]]
id                = "sub3"
text              = "Is the Grenet upper bound 2^n - 1 tight at small n (n = 3, 4)? Jansen 2011 gives m(3) = 7 = 2^3 - 1, suggesting it might be tight. Does m(4) = 15 = 2^4 - 1?"
suggested_attack  = "Combinatorial enumeration of all m x m matrices with affine entries up to symmetry, for m in [n²/2, 2^n - 1]. Check whether any realize perm_n as determinant. For n = 4, m <= 13 should be feasible."
estimated_compute = "Days; combinatorial-explosion-bound."
status            = "open"
