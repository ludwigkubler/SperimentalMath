[[open_subquestions]]
id                = "sub1"
text              = "For depth d = 3, what is the empirical shrinkage rate of random restrictions applied to size-S PARITY-computing circuits, as a function of (S, n, restriction probability p)? Does the rate match the IMP 2012 prediction in the regime S ≈ 2^(n^(1/2))?"
suggested_attack  = "Generate random depth-3 monotone-ish circuits computing PARITY at size S close to the bound; apply random restrictions with probability p; measure how often the restricted circuit collapses to depth-2. Empirically estimate the shrinkage exponent."
estimated_compute = "Days on RTX 3070 Ti; circuit enumeration is the bottleneck."
status            = "open"

[[open_subquestions]]
id                = "sub2"
text              = "Is there a *concentration* phenomenon for the constant c_d in the lower bound: i.e., does almost-every restriction yield the same shrinkage exponent, or is there a heavy tail?"
suggested_attack  = "Sampling: for fixed (n, d, p) configuration, run many independent restrictions and measure the distribution of effective shrinkage. Fit to known distributions (log-normal, power-law)."
estimated_compute = "Hours on a single GPU; scales well across seeds."
status            = "open"

[[open_subquestions]]
id                = "sub3"
text              = "How does the optimal constant change when PARITY is replaced by a symmetric function (e.g. THRESHOLD-k, MAJORITY) at the same depth d = 3? Is there a symmetric-function-specific constant that beats Håstad's general bound?"
suggested_attack  = "Same empirical setup as sub1, but compute the bound for THRESHOLD-k for various k. Compare to Beigel 1994 and Sherstov 2007 bounds for symmetric functions."
estimated_compute = "Days; symmetric-function structure may admit faster search."
status            = "open"
